name: Setup
description: Install Node, Bun and the locked dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .tool-versions
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .tool-versions
    - run: bun install --frozen-lockfile
      shell: bash
