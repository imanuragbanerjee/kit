name: UI primitives

# The shadcn/ui primitives in packages/ui/src/components/ui are never edited by
# hand. This re-syncs them from upstream and fails when they differ from what is
# committed, which means either a hand edit or a new upstream version (then run
# `bun run ui:sync` and commit). It is separate from CI on purpose: an upstream
# release must not block unrelated pull requests.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run ui:check
