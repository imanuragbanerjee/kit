name: UI primitives

# The shadcn/ui primitives in packages/ui/src/components/ui are never edited by
# hand. This re-syncs them from upstream and fails when they differ from what is
# committed, which means either a hand edit or a new upstream version (then run
# `bun run ui:sync` and commit). It is separate from CI on purpose: an upstream
# release must not block unrelated pull requests.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run ui:check
