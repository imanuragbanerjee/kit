name: Release

# Manual until npm trusted publishing is configured (published packages record
# the repository URL permanently, so confirm it first). Restore the
# `push: branches: [main]` trigger when ready.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - run: bun install --frozen-lockfile

      - uses: changesets/action@v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
